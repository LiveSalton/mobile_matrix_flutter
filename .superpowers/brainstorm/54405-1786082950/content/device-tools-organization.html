<style>
  .tool-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; margin-top:24px; }
  .tool-card { overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--surface); cursor:pointer; transition:160ms ease; }
  .tool-card:hover,.tool-card.selected { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); transform:translateY(-2px); }
  .preview { height:330px; padding:16px; background:var(--surface-2); color:var(--text); }
  .shell { height:100%; border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; display:flex; flex-direction:column; }
  .top { min-height:48px; padding:8px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .brand-line { width:78px; height:9px; border-radius:5px; background:var(--text); }
  .spacer { flex:1; }
  .switch { display:flex; padding:3px; gap:3px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); }
  .switch span { min-width:72px; padding:7px 9px; border-radius:7px; color:var(--text-muted); font-size:10px; font-weight:700; text-align:center; }
  .switch .active { color:var(--text); background:color-mix(in srgb,var(--accent) 28%,var(--surface)); border:1px solid var(--accent); }
  .sidebar-layout { flex:1; display:grid; grid-template-columns:118px 1fr; min-height:0; }
  .sidebar { padding:10px 8px; border-right:1px solid var(--border); background:var(--surface-2); }
  .section-label { width:52px; height:6px; border-radius:4px; background:var(--text-muted); margin:7px 7px; opacity:.65; }
  .nav-item { height:30px; margin-bottom:4px; border-radius:8px; display:flex; align-items:center; gap:7px; padding:0 8px; color:var(--text-muted); }
  .nav-item.active { color:var(--text); background:color-mix(in srgb,var(--accent) 24%,var(--surface)); border:1px solid var(--accent); }
  .nav-icon { width:14px; height:14px; border-radius:4px; background:currentColor; opacity:.75; }
  .nav-line { height:6px; width:58px; border-radius:4px; background:currentColor; opacity:.75; }
  .content { padding:12px; min-width:0; }
  .content-title { height:10px; width:86px; border-radius:5px; background:var(--text); margin-bottom:12px; }
  .panel-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .panel { height:80px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); padding:9px; }
  .panel-line { height:7px; width:55%; border-radius:4px; background:var(--text-muted); margin-bottom:8px; opacity:.7; }
  .panel-control { height:26px; border:1px solid var(--border); border-radius:7px; background:var(--surface); }
  .landing { flex:1; padding:12px; overflow:hidden; }
  .group-title { height:8px; width:70px; border-radius:4px; background:var(--text); margin:3px 0 9px; }
  .tile-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .tile { height:72px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); padding:9px; }
  .tile-icon { width:20px; height:20px; border-radius:6px; background:var(--accent); opacity:.8; margin-bottom:9px; }
  .tile-line { height:6px; width:68%; border-radius:4px; background:var(--text-muted); opacity:.75; }
  .copy { padding:17px; }
  .choice { display:flex; align-items:center; gap:10px; }
  .letter { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--surface-2); color:var(--accent); font-weight:800; }
  .tag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent); padding:2px 7px; border-radius:99px; }
  .copy h3 { margin:0; }
  .copy p { color:var(--text-muted); line-height:1.55; }
  @media(max-width:900px){.tool-options{grid-template-columns:1fr}.preview{height:310px}}
</style>
