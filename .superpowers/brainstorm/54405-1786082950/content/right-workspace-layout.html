<style>
  .layout-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 24px;
  }
  .layout-card {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    overflow: hidden;
    cursor: pointer;
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  .layout-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .layout-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .layout-preview {
    height: 320px;
    padding: 12px;
    background: #120f17;
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 8px;
  }
  .phone-rail {
    border: 1px solid #493849;
    border-radius: 12px;
    background: linear-gradient(180deg, #28202c, #17131b);
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .phone-top { height: 10px; border-radius: 8px; background: #5a4a5c; }
  .phone-screen { flex: 1; border-radius: 8px; background: linear-gradient(160deg, #605367, #221d27); }
  .phone-nav { height: 16px; border-radius: 7px; background: #302735; }
  .workspace-shell {
    min-width: 0;
    border: 1px solid #443648;
    border-radius: 12px;
    background: #1d1821;
    padding: 9px;
    color: #f8f2fa;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ws-header, .ws-row { display: flex; align-items: center; gap: 6px; }
  .ws-title { height: 8px; width: 74px; border-radius: 5px; background: #f3eaf4; }
  .ws-subtle { height: 6px; width: 46px; border-radius: 4px; background: #766779; }
  .ws-spacer { flex: 1; }
  .tool-pill { height: 19px; min-width: 38px; border-radius: 7px; background: #2d2532; border: 1px solid #4f4054; }
  .tool-pill.primary { background: #d8639b; border-color: #e77aaf; }
  .target-strip { padding: 7px; border-radius: 9px; background: #28212d; border: 1px solid #493a4e; }
  .chip { height: 17px; width: 45px; border-radius: 9px; background: #3d3142; border: 1px solid #5c4863; }
  .chip.active { background: #62344f; border-color: #dc6ba1; }
  .body-split { min-height: 0; flex: 1; display: grid; gap: 7px; }
  .pane { min-height: 0; border-radius: 9px; border: 1px solid #443649; background: #241d29; padding: 8px; }
  .pane-label { height: 7px; width: 58px; border-radius: 4px; background: #9b8b9e; margin-bottom: 8px; }
  .action-row { height: 27px; border-radius: 7px; background: #302737; border: 1px solid #4a3b50; margin-bottom: 6px; }
  .action-row.highlight { border-color: #b85987; background: #382534; }
  .run-row { height: 24px; border-radius: 7px; background: #2d2532; margin-bottom: 6px; display: flex; align-items: center; padding: 0 7px; }
  .run-dot { width: 7px; height: 7px; border-radius: 50%; background: #60b98a; }
  .run-line { height: 5px; flex: 1; border-radius: 4px; background: #706174; margin-left: 6px; }
  .card-copy { padding: 16px; }
  .choice-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .choice-letter { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); font-weight: 800; }
  .recommended { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 7px; }
  .card-copy h3 { margin: 0; }
  .card-copy p { margin: 8px 0 0; color: var(--text-muted); line-height: 1.5; }
  .wizard-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .step { height: 21px; border-radius: 7px; background: #302737; border: 1px solid #4a3b50; }
  .step.active { background: #62344f; border-color: #dc6ba1; }
  .device-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; flex: 1; }
  .device-tile { border-radius: 8px; background: linear-gradient(160deg, #4b3e50, #29222f); border: 1px solid #59475e; }
  .console-body { flex: 1; display: grid; grid-template-columns: 64px 1fr; gap: 7px; min-height: 0; }
  .scene-list { display: flex; flex-direction: column; gap: 5px; }
  .scene-item { height: 25px; border-radius: 7px; background: #302737; }
  .scene-item.active { background: #563148; border: 1px solid #c45f91; }
  @media (max-width: 1050px) {
    .layout-grid { grid-template-columns: 1fr; }
    .layout-preview { height: 300px; }
  }
</style>
