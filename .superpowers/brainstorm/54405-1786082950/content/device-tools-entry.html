<style>
  .entry-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; margin-top:24px; }
  .entry-card { overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--surface); cursor:pointer; transition:160ms ease; }
  .entry-card:hover,.entry-card.selected { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); transform:translateY(-2px); }
  .preview { height:330px; background:#120f17; padding:16px; color:#f8f2fa; }
  .shell { height:100%; border:1px solid #48394d; border-radius:14px; background:#1e1922; overflow:hidden; display:flex; flex-direction:column; }
  .header { min-height:50px; padding:8px 12px; border-bottom:1px solid #453748; display:flex; align-items:center; gap:8px; }
  .title { width:78px; height:9px; border-radius:5px; background:#f2eaf4; }
  .spacer { flex:1; }
  .segment { display:flex; gap:3px; padding:3px; background:#29222e; border:1px solid #493a4e; border-radius:10px; }
  .segment span { height:28px; min-width:84px; padding:0 10px; display:flex; align-items:center; justify-content:center; border-radius:7px; color:#948697; font-size:10px; font-weight:700; }
  .segment .active { color:#fff; background:#5c304a; box-shadow:inset 0 0 0 1px #c35d8e; }
  .workspace { flex:1; padding:12px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .step { height:27px; border-radius:8px; border:1px solid #4b3d50; background:#2b2430; }
  .step.active { border-color:#ce6497; background:#563047; }
  .target { height:48px; border-radius:10px; background:#29222e; border:1px solid #493b4e; display:flex; align-items:center; padding:8px; gap:7px; }
  .device { width:55px; height:25px; border-radius:12px; background:#60364e; border:1px solid #d2699b; }
  .device.dim { background:#342a39; border-color:#514256; }
  .canvas { flex:1; display:grid; grid-template-columns:1.4fr .6fr; gap:8px; min-height:0; }
  .pane { border:1px solid #443649; border-radius:10px; background:#251e2a; padding:9px; }
  .line { height:7px; width:70px; border-radius:4px; background:#8a7b8e; margin-bottom:9px; }
  .action { height:30px; border-radius:8px; background:#312837; border:1px solid #4c3d51; margin-bottom:7px; }
  .primary { height:30px; width:82px; border-radius:9px; background:#d8649b; }
  .drawer-button { height:34px; min-width:100px; border-radius:9px; display:grid; place-items:center; background:#302737; border:1px solid #59455d; color:#fff; font-size:10px; font-weight:700; }
  .drawer-stage { position:relative; flex:1; min-height:0; overflow:hidden; }
  .drawer-stage .workspace { height:100%; filter:brightness(.62); }
  .drawer { position:absolute; top:0; right:0; bottom:0; width:53%; background:#251e2a; border-left:1px solid #68445a; box-shadow:-18px 0 35px #0d0a0f99; padding:12px; }
  .drawer-head { display:flex; align-items:center; gap:7px; margin-bottom:12px; }
  .drawer-title { width:70px; height:9px; border-radius:5px; background:#f2eaf4; }
  .tool-row { height:34px; border-radius:9px; background:#302737; border:1px solid #4c3d51; margin-bottom:7px; }
  .copy { padding:17px; }
  .choice { display:flex; align-items:center; gap:10px; }
  .letter { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--surface-2); color:var(--accent); font-weight:800; }
  .tag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent); padding:2px 7px; border-radius:99px; }
  .copy h3 { margin:0; }
  .copy p { color:var(--text-muted); line-height:1.55; }
  @media(max-width:900px){.entry-options{grid-template-columns:1fr}.preview{height:310px}}
</style>

<h2>现有“设备工具”放在哪里？</h2>
<p class="subtitle">群控执行仍是默认入口；导航、剪贴板、应用安装、日志等 STF 功能统一收纳，不再平铺七个标签。</p>

<div class="entry-options">
  <div class="entry-card" data-choice="segmented" onclick="toggleSelect(this)">
    <div class="preview">
      <div class="shell">
        <div class="header"><div class="title"></div><div class="spacer"></div><div class="segment"><span class="active">群控执行</span><span>设备工具</span></div></div>
        <div class="workspace">
          <div class="steps"><div class="step active"></div><div class="step"></div><div class="step"></div></div>
          <div class="target"><div class="device"></div><div class="device dim"></div><div class="spacer"></div></div>
          <div class="canvas"><div class="pane"><div class="line"></div><div class="action"></div><div class="action"></div></div><div class="pane"><div class="line"></div><div class="action"></div></div></div>
          <div style="display:flex;justify-content:flex-end"><div class="primary"></div></div>
        </div>
      </div>
    </div>
    <div class="copy">
      <div class="choice"><span class="letter">A</span><h3>顶部双入口切换</h3><span class="tag">推荐</span></div>
      <p>“群控执行 / 设备工具”是同级工作模式。结构清晰、不遮挡内容，也能保留工具自己的完整页面。</p>
    </div>
  </div>

  <div class="entry-card" data-choice="drawer" onclick="toggleSelect(this)">
    <div class="preview">
      <div class="shell">
        <div class="header"><div class="title"></div><div class="spacer"></div><div class="drawer-button">设备工具</div></div>
        <div class="drawer-stage">
          <div class="workspace">
            <div class="steps"><div class="step active"></div><div class="step"></div><div class="step"></div></div>
            <div class="target"><div class="device"></div><div class="device dim"></div></div>
            <div class="canvas"><div class="pane"></div><div class="pane"></div></div>
          </div>
          <div class="drawer"><div class="drawer-head"><div class="drawer-title"></div><div class="spacer"></div><span>×</span></div><div class="tool-row"></div><div class="tool-row"></div><div class="tool-row"></div><div class="tool-row"></div><div class="tool-row"></div></div>
        </div>
      </div>
    </div>
    <div class="copy">
      <div class="choice"><span class="letter">B</span><h3>右侧工具抽屉</h3></div>
      <p>随时覆盖打开，切换速度快；但会压缩或遮挡工作台，复杂工具在窄抽屉中也不够舒展。</p>
    </div>
  </div>
</div>
